packages:
  - 'packages/mindapp'
  - 'packages/mind-machine'
  - 'packages/mindapp-three'
  - 'packages/mind-machine-three'
  - 'packages/mindapp-fabric'
  - 'packages/mind-machine-fabric'
  - 'apps/showroom'

allowBuilds:
  '@parcel/watcher': true
  canvas: false
  esbuild: true

nodeLinker: hoisted

minimumReleaseAge: 300

minimumReleaseAgeExclude:
  - '@bemedev/*'
  - '@oxlint/binding-linux-riscv64-gnu@1.84.0'
