name: Publish
on:
  push:
    branches:
      - beta
      - canary
      - main
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pnpm repo
        uses: chlbri/node-github-actions/.github/actions/pnpmi@main

      - name: Build
        run: pnpm run build

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        with:
          name: built-workspace
          path: |
            .
            !node_modules
            !.git
          retention-days: 1

  mind-flow:
    uses: chlbri/node-github-actions/.github/workflows/publish.yml@main
    secrets: inherit
    needs: [build]
    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: './packages/mindapp'
      artifact: built-workspace

  mind-machine:
    uses: chlbri/node-github-actions/.github/workflows/publish.yml@main
    secrets: inherit
    needs: [build]
    with:
      type:
        ${{ github.ref_name == 'beta' && 'beta' || github.ref_name == 'canary' &&
        'canary' || 'latest' }}

      package: './packages/mind-machine'
      artifact: built-workspace

  cleanup:
    name: Cleanup Artifacts
    runs-on: ubuntu-latest
    needs: [build, mind-flow, mind-machine]
    if: always()
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete artifacts
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });

              for (const artifact of artifacts.data.artifacts) {
                if (artifact.name === 'built-workspace') {
                  console.log(`Deleting artifact: ${artifact.name} (ID: ${artifact.id})`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  console.log(`Successfully deleted artifact: ${artifact.name}`);
                }
              }
            } catch (error) {
              console.log(`Error during cleanup: ${error.message}`);
            }
